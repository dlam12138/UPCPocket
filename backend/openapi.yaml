openapi: 3.1.0
info:
  title: UPC Pocket backend API
  version: 1.1.0
  description: Student account custody, read-only campus services, and school administrator operations. API responses are private and use Cache-Control: no-store, including error responses.
servers:
  - url: https://pocket.example.invalid
security: []
tags:
  - name: Student authentication
  - name: Student account
  - name: Campus services
  - name: School administration
paths:
  /api/v1/auth/sessions:
    post:
      tags: [Student authentication]
      summary: Bind an account or sign in on a device
      description: Verifies credentials through UPC CAS, stores an encrypted credential envelope, and returns a one-time Pocket bearer token.
      operationId: createStudentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Pocket device session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SignInFailed'
        '409':
          description: Verification is busy, interactive challenge is required, or the managed credential must be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/credential-updates:
    post:
      tags: [Student authentication]
      summary: Update the managed credential without a Pocket token
      operationId: updateManagedCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdateRequest'
      responses:
        '204':
          description: Credential updated; all Pocket device tokens and business sessions were revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SignInFailed'
        '409':
          description: Verification is busy or an interactive challenge is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Student account]
      summary: Read the current account state
      operationId: getMyAccount
      security:
        - PocketBearer: []
      responses:
        '200':
          description: Current account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Student account]
      summary: Unbind and hard-delete the current managed account
      operationId: unbindMyAccount
      security:
        - PocketBearer: []
      responses:
        '204':
          description: Account row deleted and all sessions revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/me/devices:
    get:
      tags: [Student account]
      summary: List this account's active Pocket devices
      operationId: listMyDevices
      security:
        - PocketBearer: []
      responses:
        '200':
          description: Active device sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/me/devices/{deviceId}:
    delete:
      tags: [Student account]
      summary: Revoke one device and the shared upstream business sessions
      operationId: revokeMyDevice
      security:
        - PocketBearer: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/me/session:
    delete:
      tags: [Student account]
      summary: Sign out the current device and clear shared business sessions
      operationId: signOutCurrentDevice
      security:
        - PocketBearer: []
      responses:
        '204':
          description: Current device revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/timetable/index:
    get:
      tags: [Campus services]
      summary: Read the authenticated student's timetable term index
      description: Fixed GET with no query parameters or request body. The response is private and no-store.
      operationId: getTimetableIndex
      security:
        - PocketBearer: []
      responses:
        '200':
          description: Timetable terms and current-week metadata
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableIndex'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/timetable/week:
    get:
      tags: [Campus services]
      summary: Read one authenticated timetable week
      description: The year, term, and week are validated against the student's term index. No identity, URL, or body override is accepted.
      operationId: getTimetableWeek
      security:
        - PocketBearer: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: term
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: week
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 30
      responses:
        '200':
          description: One seven-day timetable window; business data is not stored by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableWeek'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/card/balance:
    get:
      tags: [Campus services]
      summary: Read the balance belonging to the authenticated student's supported numeric identity
      description: The student number is derived from the verified login and bound to the Pocket token. It is never a query parameter or returned in the response.
      operationId: getCardBalance
      security:
        - PocketBearer: []
      responses:
        '200':
          description: Card amounts only; private and no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdentityUnsupported'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/card/transactions:
    get:
      tags: [Campus services]
      summary: Read a page of the authenticated student's card transactions
      operationId: getCardTransactions
      security:
        - PocketBearer: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of redacted transaction rows; payment numbers and upstream fields are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/card/transactions/summary:
    get:
      tags: [Campus services]
      summary: Read the authenticated student's card transaction totals
      operationId: getCardTransactionSummary
      security:
        - PocketBearer: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Income and expense totals in fen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/grades/terms:
    get:
      tags: [Campus services]
      summary: Read the authenticated student's grade term index
      operationId: getGradeTerms
      security:
        - PocketBearer: []
      responses:
        '200':
          description: Grade terms, with current term when supplied by the source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradesTerms'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/grades/courses:
    get:
      tags: [Campus services]
      summary: Read the authenticated student's courses for one grade term
      operationId: getGradeCourses
      security:
        - PocketBearer: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: term
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The courses for the requested term; business records are returned only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradesCourses'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamProtocolError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/account-lookups:
    post:
      tags: [School administration]
      summary: Look up a managed account by login name
      description: Requires the account.read administrator scope.
      operationId: lookupManagedAccount
      security:
        - AdminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      responses:
        '200':
          description: Lookup result; a missing account is represented by a null account.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    oneOf:
                      - $ref: '#/components/schemas/AdminAccount'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/modules/{moduleKey}/status:
    get:
      tags: [School administration]
      summary: Read a campus module switch and health summary
      description: Requires module.read scope and a valid MFA JWT. Returns a quoted revision ETag.
      operationId: getModuleStatus
      security:
        - AdminJwt: []
      parameters:
        - $ref: '#/components/parameters/ModuleKey'
      responses:
        '200':
          description: Module state and adapter readiness
          headers:
            ETag:
              schema:
                type: string
                example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      tags: [School administration]
      summary: Enable or disable a campus module
      description: Requires module.manage scope and a valid MFA JWT. State, revision, event, and detail row commit atomically.
      operationId: setModuleEnabled
      security:
        - AdminJwt: []
      parameters:
        - $ref: '#/components/parameters/ModuleKey'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleEnabledRequest'
      responses:
        '200':
          description: Updated module state with a new ETag
          headers:
            ETag:
              schema:
                type: string
                example: '"2"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/RevisionChanged'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/accounts/{id}/disabled:
    put:
      tags: [School administration]
      summary: Disable or restore an account
      description: Requires the account.manage administrator scope.
      operationId: setAccountDisabled
      security:
        - AdminJwt: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: If-Match
          in: header
          required: true
          description: Current gate revision, optionally quoted as an ETag.
          schema:
            type: string
            example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: New account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionChanged'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/accounts/{id}/sessions:
    delete:
      tags: [School administration]
      summary: Revoke every Pocket device and business session
      description: Requires the account.manage administrator scope.
      operationId: revokeAccountSessions
      security:
        - AdminJwt: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Sessions revoked and gate revision advanced
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionChanged'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/key-rotations:
    post:
      tags: [School administration]
      summary: Switch the active write key and rewrap a bounded batch of DEKs
      description: Requires the key.rotate administrator scope.
      operationId: rotateMasterKey
      security:
        - AdminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVersion, expectedWriteVersion]
              properties:
                targetVersion:
                  type: string
                expectedWriteVersion:
                  type: string
      responses:
        '200':
          description: Rotation batch progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyRotation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Target key is not configured or write version changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/health:
    get:
      tags: [School administration]
      summary: Check DB, Flyway, key provider, and CAS configuration
      description: Requires health.read. Does not perform a school login.
      operationId: getAdminHealth
      security:
        - AdminJwt: []
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/admin/v1/audit-events:
    get:
      tags: [School administration]
      summary: Read a sanitized audit page
      description: Requires the audit.read administrator scope.
      operationId: listAuditEvents
      security:
        - AdminJwt: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Audit rows contain only fixed codes and opaque identifiers; references and login names are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    PocketBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    AdminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT must pass issuer, audience, expiry, MFA, and route-specific scope checks.
  parameters:
    ModuleKey:
      name: moduleKey
      in: path
      required: true
      schema:
        type: string
        enum: [timetable, card, grades]
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SignInRequest:
      type: object
      required: [loginName, password, acceptCustody, installationId, platform, kind]
      properties:
        loginName:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        acceptCustody:
          type: boolean
          const: true
        installationId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ANDROID, IOS, OTHER]
        kind:
          type: string
          enum: [PHONE, TABLET, OTHER]
    CredentialUpdateRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    AccountLookupRequest:
      type: object
      required: [loginName]
      properties:
        loginName:
          type: string
    SessionResponse:
      type: object
      required: [token, deviceId, expiresAt]
      properties:
        token:
          type: string
          description: Shown only at issuance; server stores its SHA-256 digest.
        deviceId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    StudentAccount:
      $ref: '#/components/schemas/AdminAccount'
    AdminAccount:
      type: object
      required: [accountId, state, credentialGeneration, gateRevision]
      properties:
        accountId:
          type: string
          format: uuid
        state:
          type: string
          enum: [ACTIVE, REAUTH_REQUIRED, DISABLED]
        credentialGeneration:
          type: integer
          format: int64
        gateRevision:
          type: integer
          format: int64
    Device:
      type: object
      required: [deviceId, installationId, platform, kind, expiresAt]
      properties:
        deviceId:
          type: string
          format: uuid
        installationId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ANDROID, IOS, OTHER]
        kind:
          type: string
          enum: [PHONE, TABLET, OTHER]
        expiresAt:
          type: string
          format: date-time
    KeyRotation:
      type: object
      required: [writeVersion, rewrapped, remaining, complete]
      properties:
        writeVersion:
          type: string
        rewrapped:
          type: integer
        remaining:
          type: integer
          format: int64
        complete:
          type: boolean
    Health:
      type: object
      required: [database, migrations, masterKeyProvider, casVerifier]
      properties:
        database:
          type: boolean
        migrations:
          type: boolean
        masterKeyProvider:
          type: boolean
        casVerifier:
          type: boolean
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [eventId, occurredAt, requestId, actionCode, resultCode]
            properties:
              eventId:
                type: string
                format: uuid
              occurredAt:
                type: string
                format: date-time
              requestId:
                type: string
                format: uuid
              actionCode:
                type: string
                enum: [LOOKUP, DISABLE, RESTORE, REVOKE_ALL, ROTATE_KEY, READ_AUDIT, UNBIND, TRIP_REAUTH, UPDATE_CREDENTIAL]
              resultCode:
                type: string
                enum: [OK, DENIED, CONFLICT, FAILED, PARTIAL]
        nextCursor:
          type: [string, 'null']
    ModuleStatus:
      type: object
      required: [moduleKey, enabled, revision, adapterReady, circuitState]
      properties:
        moduleKey:
          type: string
          enum: [timetable, card, grades]
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        adapterReady:
          type: boolean
        circuitState:
          type: string
          enum: [CLOSED, OPEN, HALF_OPEN]
    ModuleEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    TimetableTerm:
      type: object
      required: [year, term, label, startDay, totalWeeks]
      properties:
        year:
          type: string
        term:
          type: string
        label:
          type: string
        startDay:
          type: string
          format: date
        totalWeeks:
          type: integer
          minimum: 1
          maximum: 30
    TimetableIndex:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TimetableTerm'
        currentYear:
          type: [string, 'null']
        currentTerm:
          type: [string, 'null']
        currentWeek:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
        weekDates:
          type: [array, 'null']
          items:
            type: string
            format: date
        compatibilityNote:
          type: [string, 'null']
    TimetableMeeting:
      type: object
      required: [courseName, date, dayOfWeek, startPeriod, endPeriod]
      properties:
        courseName:
          type: string
        date:
          type: string
          format: date
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startPeriod:
          type: integer
          minimum: 1
          maximum: 14
        endPeriod:
          type: integer
          minimum: 1
          maximum: 14
        rawPeriod:
          type: [string, 'null']
        teacher:
          type: [string, 'null']
        location:
          type: [string, 'null']
        weeksLabel:
          type: [string, 'null']
        courseCode:
          type: [string, 'null']
        classGroup:
          type: [string, 'null']
    TimetableWeek:
      type: object
      required: [year, term, week, weekDates, meetings, complete, fetchedAtEpochMillis]
      properties:
        year:
          type: string
        term:
          type: string
        week:
          type: integer
          minimum: 1
          maximum: 30
        weekDates:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: string
            format: date
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/TimetableMeeting'
        complete:
          type: boolean
        fetchedAtEpochMillis:
          type: integer
          format: int64
          minimum: 0
    CardBalance:
      type: object
      required: [balanceCents, transitionCents, fetchedAtEpochMillis]
      properties:
        balanceCents:
          type: integer
          format: int64
        transitionCents:
          type: integer
          format: int64
        fetchedAtEpochMillis:
          type: integer
          format: int64
          minimum: 0
    CardTransactionRow:
      type: object
      required: [rowKey, title, time, amountFen]
      properties:
        rowKey:
          type: string
        title:
          type: string
        time:
          type: string
        amountFen:
          type: integer
          format: int64
    CardTransactions:
      type: object
      required: [page, size, total, pages, rows]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        pages:
          type: integer
          format: int64
          minimum: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CardTransactionRow'
    CardTransactionSummary:
      type: object
      required: [incomeFen, expenseFen]
      properties:
        incomeFen:
          type: integer
          format: int64
        expenseFen:
          type: integer
          format: int64
    GradesTerm:
      type: object
      required: [year, term]
      properties:
        year:
          type: string
        term:
          type: string
    GradesTerms:
      type: object
      required: [terms]
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/GradesTerm'
        currentTerm:
          oneOf:
            - $ref: '#/components/schemas/GradesTerm'
            - type: 'null'
    GradesCourse:
      type: object
      required: [courseName]
      properties:
        courseName:
          type: string
        score:
          type: [string, 'null']
        credits:
          type: [string, 'null']
        courseType:
          type: [string, 'null']
        examType:
          type: [string, 'null']
    GradesCourses:
      type: object
      required: [year, term, courses, complete, fetchedAtEpochMillis]
      properties:
        year:
          type: string
        term:
          type: string
        courses:
          type: array
          items:
            $ref: '#/components/schemas/GradesCourse'
        complete:
          type: boolean
        fetchedAtEpochMillis:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, CUSTODY_ACCEPTANCE_REQUIRED, SIGN_IN_FAILED, TOKEN_INVALID, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERIFICATION_BUSY, INTERACTIVE_CHALLENGE, CREDENTIAL_UPDATE_REQUIRED, KEY_VERSION_CONFLICT, RATE_LIMITED, REVISION_CHANGED, MODULE_DISABLED, CIRCUIT_OPEN, UPSTREAM_UNAVAILABLE, UPSTREAM_TIMEOUT, DEPENDENCY_UNAVAILABLE, IDENTITY_UNSUPPORTED, UPSTREAM_PROTOCOL_ERROR, INTERNAL_ERROR]
        requestId:
          type: string
          format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SignInFailed:
      description: Anonymous sign-in failed; account existence and status are not disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Missing Pocket authentication or an invalid, revoked, expired, or disabled Pocket token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated administrator lacks the required scope or MFA claim.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not owned by the current account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RevisionChanged:
      description: If-Match account or module revision no longer matches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Interactive challenge, required credential update, or verification contention.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdentityUnsupported:
      description: The verified login name does not have a supported numeric student number.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamProtocolError:
      description: The configured adapter returned an invalid response; upstream content is omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamTimeout:
      description: The module-specific total upstream timeout elapsed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Authentication rate limit exceeded; includes Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Upstream or required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure; the body contains only a fixed code and request identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

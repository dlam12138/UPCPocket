spring:
  datasource:
    url: jdbc:h2:mem:pocket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    log-request-details: false

logging:
  level:
    org.springframework.jdbc.core: WARN
    org.springframework.jdbc.core.StatementCreatorUtils: OFF
    org.springframework.web: WARN
    org.springframework.web.filter.CommonsRequestLoggingFilter: OFF

pocket:
  vault:
    master-keys: "test:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    initial-write-key-version: test
    login-index-key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
    audit-index-key: "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI="
  admin:
    jwt:
      jwk-set-uri: https://issuer.example.invalid/.well-known/jwks.json
      issuer: https://issuer.example.invalid/
      audience: upcpocket-admin-test
  cas:
    enabled: false
  proxy:
    not-configured-adapters: false
    single-flight:
      max-entries: 64
      max-waiters-per-entry: 8
      wait-timeout-ms: 5000
    account-rate-limit:
      window-ms: 60000
      max-requests: 1000
      max-tracked-accounts: 1000
    modules:
      timetable:
        timeout-ms: 5000
        max-concurrency: 4
        queue-capacity: 8
        circuit-failure-threshold: 3
        circuit-cooldown-ms: 1000
      card:
        timeout-ms: 5000
        max-concurrency: 4
        queue-capacity: 8
        circuit-failure-threshold: 3
        circuit-cooldown-ms: 1000
      grades:
        timeout-ms: 5000
        max-concurrency: 4
        queue-capacity: 8
        circuit-failure-threshold: 3
        circuit-cooldown-ms: 1000
